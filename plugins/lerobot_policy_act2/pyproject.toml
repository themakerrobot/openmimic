[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_policy_act2"
version = "0.1.0"
description = "ACT2 — ACT with selectable backbone (ResNet/DINOv2), train-time augmentation, chunk interpolation and optional flow-matching action head, for LeRobot"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[tool.setuptools]
packages = ["lerobot_policy_act2"]
